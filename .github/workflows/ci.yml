name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
      - name: Install dependencies
        run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy src
      - name: Unit + contract tests
        run: uv run pytest -q

  integration:
    runs-on: ubuntu-latest
    needs: api-gates
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
      - name: Boot compose (postgres/redis/minio/api)
        run: docker compose up -d postgres redis minio api
      - name: Wait for health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/readyz && break || sleep 2
          done
      - name: Integration tests (real PostGIS + broker round-trip)
        run: |
          cd services/api && uv sync --frozen && uv run pytest -m integration -q

  fresh-db-migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.11.24"
      - name: Fresh database round trip
        run: |
          sudo apt-get install -y postgresql-client
          docker compose up -d postgres
          cd services/api && uv sync --frozen
          PG_VERSION_TRY=1
          export TK_DATABASE_URL="postgresql+asyncpg://tk:tk_dev_password@127.0.0.1:5434/theek_karo"
          for i in $(seq 1 60); do docker compose exec -T postgres pg_isready -U tk -d theek_karo && break || sleep 2; done
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head
          echo "migration round trip OK"

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy image scan (API)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: python:3.14-slim
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy repo scan (source)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Python dependency audit (pip-audit)
        working-directory: services/api
        run: uvx pip-audit
      - name: Bandit SAST (Python)
        working-directory: services/api
        run: uvx bandit -q -r src
      - name: Semgrep SAST (Python)
        working-directory: services/api
        run: uvx semgrep scan --config=auto --severity ERROR --severity WARNING .

  web-gates:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npx vitest run
      - run: npm run build

  web-e2e:
    runs-on: ubuntu-latest
    needs: [api-gates, web-gates]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Boot compose (postgres/redis/minio/api)
        run: docker compose up -d postgres redis minio api
      - name: Wait for API health
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:8001/readyz && break || sleep 2
          done
          curl -sf http://127.0.0.1:8001/readyz
      - name: Install deps + browser
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright e2e (mobile + budget)
        working-directory: apps/web
        run: npx playwright test
