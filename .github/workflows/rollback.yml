name: Rollback

on:
  workflow_dispatch:
    inputs:
      environment:
        description: staging or prod
        required: true
      service:
        description: api, worker, web (all = all)
        required: true
        default: all
      task_revision:
        description: ECS task-def revision to restore (optional; previous if blank)
        required: false

permissions:
  id-token: write
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(format('["{0}"]', inputs.service == 'all' ? 'api","worker","web' : inputs.service)) }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Restore previous task-def revision
        run: |
          CLUSTER="tk-${{ inputs.environment }}"
          TASK_DEF_NAME="tk-${{ matrix.service }}-task"
          REV="${{ inputs.task_revision }}"
          if [ -z "$REV" ]; then
            REV=$(( $(aws ecs describe-task-definition --task-definition "$TASK_DEF_NAME" --query 'taskDefinition.revision' --output text) - 1 ))
          fi
          aws ecs update-service \
            --cluster "$CLUSTER" \
            --service "tk-${{ matrix.service }}" \
            --task-definition "$TASK_DEF_NAME:$REV" \
            --force-new-deployment
          aws ecs wait services-stable --cluster "$CLUSTER" --services "tk-${{ matrix.service }}"
      - name: Smoke after rollback
        run: |
          curl -sf --retry 10 --retry-delay 5 "${{ secrets.SMOKE_URL }}/readyz" | grep -q '"ok"'
