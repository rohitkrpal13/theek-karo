name: PR Security Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

jobs:
  quick-security-check:
    name: Quick Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in PR
        run: |
          echo "🔍 Checking for secrets in PR..."
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1)
          
          # Check for common secret patterns
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              if grep -n -E '(password|secret|api_key|token|credential)\s*=\s*["\x27][^"\x27]{8,}' "$file" 2>/dev/null; then
                echo "❌ Potential secret found in $file"
                exit 1
              fi
            fi
          done
          
          echo "✅ No secrets detected"

      - name: Check for sensitive files
        run: |
          echo "🔍 Checking for sensitive files in PR..."
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1)
          
          # Check for sensitive file types
          for file in $CHANGED_FILES; do
            case "$file" in
              *.pem|*.key|*.p12|*.pfx)
                echo "❌ Private key file found: $file"
                exit 1
                ;;
              .env|.env.*)
                echo "❌ Environment file found: $file"
                exit 1
                ;;
            esac
          done
          
          echo "✅ No sensitive files detected"

      - name: Check for large files
        run: |
          echo "🔍 Checking for large files in PR..."
          
          # Get changed files
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1)
          
          for file in $CHANGED_FILES; do
            if [ -f "$file" ]; then
              SIZE=$(wc -c < "$file" 2>/dev/null || echo 0)
              if [ "$SIZE" -gt 5242880 ]; then  # 5MB
                echo "⚠️ Large file detected: $file ($(( SIZE / 1024 / 1024 ))MB)"
              fi
            fi
          done
          
          echo "✅ No oversized files detected"

      - name: Verify security documentation
        run: |
          echo "🔍 Verifying security documentation..."
          
          # Check if security-related changes have documentation
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD 2>/dev/null || git diff --name-only HEAD~1)
          
          SECURITY_CHANGES=$(echo "$CHANGED_FILES" | grep -E '(security|auth|permission|role)' || true)
          
          if [ -n "$SECURITY_CHANGES" ]; then
            echo "⚠️ Security-related files changed:"
            echo "$SECURITY_CHANGES"
            
            # Check if SECURITY.md or docs/SECURITY.md was updated
            if ! echo "$CHANGED_FILES" | grep -qE '(SECURITY\.md|security\.md)'; then
              echo "⚠️ Consider updating security documentation"
            fi
          fi
          
          echo "✅ Documentation check complete"

      - name: Add PR comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const status = '${{ job.status }}';
            const emoji = status === 'success' ? '✅' : '⚠️';
            
            const body = `## ${emoji} Security Check Complete
            
            **Status:** ${status}
            
            ### Checks Performed:
            - ✅ Secret detection
            - ✅ Sensitive file detection
            - ✅ Large file detection
            - ✅ Security documentation
            
            ### Resources:
            - [Security Policy](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/SECURITY.md)
            - [Contributing Guidelines](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)
            
            ---
            *This is an automated security check. For detailed scans, see the full [Security Scan workflow](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/security-scan.yml).*`;
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
