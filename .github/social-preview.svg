<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="50%" style="stop-color:#16213e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9933"/>
      <stop offset="50%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#138808"/>
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg)"/>
  
  <!-- Decorative elements -->
  <circle cx="100" cy="100" r="200" fill="rgba(255,153,51,0.1)"/>
  <circle cx="1180" cy="540" r="250" fill="rgba(19,136,8,0.1)"/>
  
  <!-- Indian tricolor accent line -->
  <rect x="0" y="0" width="1280" height="8" fill="url(#accent)"/>
  
  <!-- Main title -->
  <text x="640" y="200" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle">
    🇮🇳 Theek Karo
  </text>
  
  <!-- Hindi tagline -->
  <text x="640" y="270" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#ff9933" text-anchor="middle">
    ठीक करो — Make It Right
  </text>
  
  <!-- Description -->
  <text x="640" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#a0a0a0" text-anchor="middle">
    India-first, AI-native civic intelligence platform
  </text>
  
  <!-- Feature highlights -->
  <text x="640" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="22" fill="#ffffff" text-anchor="middle">
    Report • Verify • Track • Resolve
  </text>
  
  <!-- Tech stack badges -->
  <g transform="translate(640, 490)">
    <rect x="-280" y="-20" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)"/>
    <text x="-230" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle">FastAPI</text>
    
    <rect x="-150" y="-20" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)"/>
    <text x="-100" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle">Next.js</text>
    
    <rect x="-20" y="-20" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)"/>
    <text x="30" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle">PostgreSQL</text>
    
    <rect x="110" y="-20" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)"/>
    <text x="160" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle">AI/ML</text>
    
    <rect x="240" y="-20" width="100" height="30" rx="15" fill="rgba(255,255,255,0.1)"/>
    <text x="290" y="0" font-family="system-ui, -apple-system, sans-serif" font-size="14" fill="white" text-anchor="middle">15 Languages</text>
  </g>
  
  <!-- Bottom accent line -->
  <rect x="0" y="632" width="1280" height="8" fill="url(#accent)"/>
  
  <!-- GitHub URL -->
  <text x="640" y="600" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#666" text-anchor="middle">
    github.com/rohitkrpal13/theek-karo
  </text>
</svg>
