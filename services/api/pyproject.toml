[project]
name = "tk-api"
version = "0.9.0"
description = "Theek Karo civic intelligence platform - API service"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23",
    "asyncpg>=0.31.0",
    "celery>=5.4",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "minio>=7.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pillow>=11",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "httpx>=0.28.1",
    "mypy>=1.14",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.9",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Generated migration files: keep alembic's declarative column-literal style.
"alembic/versions/*.py" = ["E501", "RUF003"]
"src/tk_api/api/routers/realtime.py" = ["E501", "SIM105", "UP043"]
"tests/test_realtime.py" = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = false
warn_unused_ignores = false
ignore_missing_imports = true
show_error_codes = true
# Modern strict baseline, relaxed for legacy modules that need gradual migration
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = false

[[tool.mypy.overrides]]
module = [
    "tk_api.worker.*",
    "geoalchemy2.*",
    "minio.*",
    "argon2.*",
    "opentelemetry.*",
    "celery.*",
    "PIL.*",
    "prometheus_client.*",
]
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = [
    "tk_api.ai.recidivism",
    "tk_api.ai.triage",
    "tk_api.ai.tools",
    "tk_api.gis.service",
    "tk_api.media.storage",
    "tk_api.production.cache",
    "tk_api.auth.security",
    "tk_api.auth.otp",
    "tk_api.core.rate_limit",
    "tk_api.core.pagination",
    "tk_api.core.resilience",
    "tk_api.publicdata.service",
    "tk_api.api.routers.media",
    "tk_api.api.routers.institutions",
    "tk_api.api.routers.geography",
    "tk_api.api.routers.realtime",
    "tk_api.institutions.service",
    "tk_api.geography.service",
    "tk_api.main",
]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = ["integration: requires live compose database (make up)"]
asyncio_mode = "auto"
