[project]
name = "tk-api"
version = "0.9.0"
description = "Theek Karo civic intelligence platform - API service"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=23",
    "asyncpg>=0.31.0",
    "celery>=5.4",
    "fastapi>=0.115",
    "geoalchemy2>=0.15",
    "httpx>=0.27",
    "jsonschema>=4.23",
    "minio>=7.2",
    "opentelemetry-api>=1.44.0",
    "opentelemetry-exporter-otlp-proto-http>=1.44.0",
    "opentelemetry-instrumentation-fastapi>=0.65b0",
    "opentelemetry-sdk>=1.44.0",
    "pillow>=11",
    "prometheus-client>=0.21",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.34",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "alembic>=1.19.1",
    "httpx2>=2.10.0",
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
    "types-jsonschema>=4.26.0.20260518",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tk_api"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Generated migration files: keep alembic's declarative column-literal style.
"alembic/versions/*.py" = ["E501", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.13"

[[tool.mypy.overrides]]
module = "tk_api.worker.*"
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: requires live compose database (make up)"]
